name: Publish Flatpak Repository

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publishes the signed Flatpak repository (build/flatpak-repo) plus a landing
# page to GitHub Pages. Users add the remote once and then install and update
# the add-on with plain `flatpak install` commands.

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-repo
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Install Flatpak build runtimes
        # The runner has no flathub remote by default, and pre-installing the
        # SDK/runtime keeps flatpak-builder from running host-side installs
        # that need a D-Bus session.
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub \
            org.kde.Sdk//6.11 \
            org.fcitx.Fcitx5//stable

      - name: Prepare source archive
        # The manifest references flatpak/source.tar.gz, whose entries sit
        # under a source/ directory, exactly as `just build-flatpak` does.
        run: |
          tar -czf flatpak/source.tar.gz --transform='s,^,source/,' \
            CMakeLists.txt LICENSE data src tests \
            flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "GPG_FPR=$FPR" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build the repository
        run: |
          mkdir -p build
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=build/flatpak-repo \
            build/flatpak flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.yml
          test -f build/flatpak-repo/config
          test -f build/flatpak/files/lib/fcitx5/libfcitx5-google-ime.so

      - name: Sign the repository
        # Signing happens on the runner, not inside the builder sandbox:
        # build-update-repo rewrites the summary with signatures from the key.
        run: |
          flatpak build-update-repo \
            --gpg-sign="$GPG_FPR" --gpg-homedir="$GNUPGHOME" \
            --title="Google Cantonese IME" \
            --comment="fcitx5 add-on: Cantonese input method using Google Input Tools" \
            build/flatpak-repo

      - id: pages
        uses: actions/configure-pages@v4

      - name: Assemble site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          PUB=$(gpg --export --armor "$GPG_FPR" | base64 -w0)
          mkdir -p site
          cp -a build/flatpak-repo site/repo
          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=Google Cantonese IME' \
            "Url=${BASE_URL}repo" \
            'Comment=fcitx5 add-on: Cantonese input method using Google Input Tools' \
            "GPGKey=${PUB}" > site/index.flatpakrepo
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Google Cantonese IME — Flatpak repository</title>
          </head>
          <body style="font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem;">
            <h1>Google Cantonese IME</h1>
            <p>A Cantonese input method for fcitx5 that sends romanized input to
            Google Input Tools over HTTPS. This site hosts the signed Flatpak
            repository for
            <a href="https://github.com/ykshek/fcitx5-google-cantonese-ime">fcitx5-google-cantonese-ime</a>.</p>

            <h2>Add the remote (once)</h2>
            <pre>flatpak remote-add --if-not-exists google-ime ${BASE_URL}index.flatpakrepo</pre>

            <h2>Install</h2>
            <p>The Fcitx5 Flatpak (org.fcitx.Fcitx5) must be installed first.</p>
            <pre>flatpak install google-ime org.fcitx.Fcitx5.Addon.GoogleIME</pre>

            <h2>After installing</h2>
            <pre>flatpak kill org.fcitx.Fcitx5</pre>
            <p>Then add “Google IME” in fcitx5's input method list.</p>

            <p>Single-file bundles for each release are also published on
            <a href="https://github.com/ykshek/fcitx5-google-cantonese-ime/releases">GitHub releases</a>.</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
