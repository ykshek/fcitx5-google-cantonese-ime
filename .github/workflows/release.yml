name: Build and Release RPM and Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-builder

jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up image tag
      id: vars
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(sed -nE 's/^project\(fcitx5-google-cantonese-ime VERSION ([^ )]+).*/\1/p' CMakeLists.txt)
        fi
        test -n "$VERSION"
        echo "image_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Log in to Container Registry
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish development container
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        file: Containerfile
        push: true
        tags: ${{ steps.vars.outputs.image_tag }}
        cache-from: type=gha,scope=fcitx5-devcontainer
        cache-to: type=gha,mode=max,scope=fcitx5-devcontainer

  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - name: Set up version
      id: vars
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(sed -nE 's/^project\(fcitx5-google-cantonese-ime VERSION ([^ )]+).*/\1/p' CMakeLists.txt)
        fi
        test -n "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Prepare RPM build inputs
      run: |
        mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
        git archive --format=tar.gz \
          --prefix="v${{ steps.vars.outputs.version }}/" HEAD \
          > "rpmbuild/SOURCES/v${{ steps.vars.outputs.version }}.tar.gz"
        cp fcitx5-google-cantonese-ime.spec rpmbuild/SPECS/

    - name: Build RPM in Fedora
      run: |
        docker run --rm \
          --volume "$(pwd):/workspace" \
          --workdir /workspace \
          quay.io/fedora/fedora:latest \
          bash -euo pipefail -c '
            dnf5 -y install \
              cmake gcc-c++ make git libcurl-devel json-devel \
              pkgconf-pkg-config fcitx5-devel extra-cmake-modules \
              rpm-build rpmdevtools gawk
            rpmbuild --define "_topdir /workspace/rpmbuild" \
                     --define "version ${{ steps.vars.outputs.version }}" \
                     -ba rpmbuild/SPECS/fcitx5-google-cantonese-ime.spec
          '

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: release-rpms
        path: |
          rpmbuild/RPMS/**/*.rpm
          rpmbuild/SRPMS/**/*.rpm
        if-no-files-found: error
        retention-days: 7

  build-flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up version
      id: vars
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(sed -nE 's/^project\(fcitx5-google-cantonese-ime VERSION ([^ )]+).*/\1/p' CMakeLists.txt)
        fi
        test -n "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Flatpak build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder

    - name: Install Flatpak build runtimes
      run: |
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --noninteractive --assumeyes flathub \
          org.kde.Sdk//6.11 \
          org.fcitx.Fcitx5//stable

    - name: Build Flatpak extension
      run: |
        set -euo pipefail
        source_archive=flatpak/source.tar.gz
        trap 'rm -f "$source_archive"' EXIT
        mkdir -p build release-artifacts
        tar -czf "$source_archive" --transform='s,^,source/,' \
          CMakeLists.txt LICENSE data src tests \
          flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml
        flatpak-builder --user --force-clean --disable-rofiles-fuse \
          --install-deps-from=flathub \
          --repo=build/flatpak-repo \
          build/flatpak flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.yml
        flatpak_files=build/flatpak/files
        if [[ ! -f "$flatpak_files/lib/fcitx5/libfcitx5-google-ime.so" ]]; then
          echo "Error: Flatpak add-on library was not installed under lib/fcitx5"
          exit 1
        fi
        test ! -e "$flatpak_files/lib64/fcitx5/libfcitx5-google-ime.so"
        test -f "$flatpak_files/share/fcitx5/addon/google-ime.conf"
        test -f "$flatpak_files/share/fcitx5/inputmethod/google-ime.conf"
        test -f "$flatpak_files/share/metainfo/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml"
        flatpak build-bundle --runtime --arch=x86_64 \
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
          build/flatpak-repo \
          "release-artifacts/org.fcitx.Fcitx5.Addon.GoogleIME-${{ steps.vars.outputs.version }}-x86_64.flatpak" \
          org.fcitx.Fcitx5.Addon.GoogleIME stable

    - name: Upload Flatpak artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: release-flatpak
        path: release-artifacts/*.flatpak
        if-no-files-found: error
        retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-rpm
      - build-flatpak
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - name: Set up release variables
      id: vars
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(sed -nE 's/^project\(fcitx5-google-cantonese-ime VERSION ([^ )]+).*/\1/p' CMakeLists.txt)
          TAG="v$VERSION"
        fi
        test -n "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "release_name=fcitx5-google-cantonese-ime $VERSION" >> "$GITHUB_OUTPUT"

    - name: Download release artifacts
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        pattern: release-*
        path: release-artifacts
        merge-multiple: true

    - name: Collect RPM packages
      run: |
        find release-artifacts -mindepth 2 -type f -name '*.rpm' \
          -exec mv -t release-artifacts/ {} +

    - name: Generate checksums
      run: |
        cd release-artifacts
        compgen -G '*.rpm' >/dev/null
        compgen -G '*.flatpak' >/dev/null
        sha256sum *.rpm *.flatpak > SHA256SUMS

    - name: Generate release notes
      run: |
        cat > release_notes.md << EOF
        A self-contained fcitx5 engine that queries Google Input Tools over HTTPS.

        ## Installation (Fedora 44)

        Install from COPR or download the RPM below and install it:

        \`\`\`bash
        sudo dnf install fcitx5-google-cantonese-ime-*.rpm
        \`\`\`

        ## Installation (Fcitx5 Flatpak)

        Download the Flatpak extension bundle and install it for your user:

        \`\`\`bash
        flatpak install --user ./org.fcitx.Fcitx5.Addon.GoogleIME-${{ steps.vars.outputs.version }}-x86_64.flatpak
        \`\`\`

        The Fcitx5 Flatpak runtime from Flathub must be installed. Restart Fcitx5
        and enable the Google IME add-on/input method after installation.

        After installing, restart fcitx5 and add the "Google IME" (粵) input
        method in the fcitx5 configuration tool (RPM installation):

        \`\`\`bash
        fcitx5 -r -d
        \`\`\`

        ## Verification

        Verify the integrity of downloaded files:

        \`\`\`bash
        sha256sum -c SHA256SUMS
        \`\`\`
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        tag_name: ${{ steps.vars.outputs.tag }}
        name: ${{ steps.vars.outputs.release_name }}
        body_path: release_notes.md
        files: |
          release-artifacts/*.rpm
          release-artifacts/*.flatpak
          release-artifacts/SHA256SUMS
        draft: false
        prerelease: false

    - name: Update latest tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -f latest
        git push origin latest --force
