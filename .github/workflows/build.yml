name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-builder

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Build development container
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        file: Containerfile
        tags: localhost/fcitx5-google-cantonese-ime:dev
        load: true
        cache-from: type=gha,scope=fcitx5-devcontainer
        cache-to: type=gha,mode=max,scope=fcitx5-devcontainer

    - name: Build project
      run: |
        mkdir -p build
        docker run --rm \
          --volume "$(pwd):/workspace" \
          --workdir /workspace \
          localhost/fcitx5-google-cantonese-ime:dev \
          bash -c '
            set -euo pipefail
            cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr
            make -j$(nproc)
            ctest --test-dir . --output-on-failure
          '

    - name: Test RPM build
      run: |
        # Create RPM build structure
        mkdir -p rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}

        # Create source tarball with valid RPM version (no hyphens)
        VERSION=$(grep '^Version:' fcitx5-google-cantonese-ime.spec | awk '{print $2}')
        git archive --format=tar.gz --prefix=v${VERSION}/ HEAD > rpmbuild/SOURCES/v${VERSION}.tar.gz

        # Copy spec file
        cp fcitx5-google-cantonese-ime.spec rpmbuild/SPECS/

        # Test RPM build
        docker run --rm \
          --volume "$(pwd):/workspace" \
          --workdir /workspace \
          localhost/fcitx5-google-cantonese-ime:dev \
          bash -c "
            set -euo pipefail
            rpmbuild --define '_topdir /workspace/rpmbuild' \
                     --define 'version ${VERSION}' \
                     -ba rpmbuild/SPECS/fcitx5-google-cantonese-ime.spec
          "

        echo "RPM build test successful!"
        find rpmbuild/RPMS -name "*.rpm" -type f
        find rpmbuild/SRPMS -name "*.rpm" -type f

    - name: Upload RPM build artifacts
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: build-rpm-artifacts
        path: |
          rpmbuild/RPMS/
          rpmbuild/SRPMS/
        retention-days: 7

  build-flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install Flatpak build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder

    - name: Install Flatpak build runtimes
      run: |
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --noninteractive --assumeyes flathub \
          org.kde.Sdk//6.11 \
          org.fcitx.Fcitx5//stable

    - name: Build and verify Flatpak add-on
      run: |
        set -euo pipefail
        mkdir -p build
        source_archive=flatpak/source.tar.gz
        trap 'rm -f "$source_archive"' EXIT
        tar -czf "$source_archive" --transform='s,^,source/,' \
          CMakeLists.txt LICENSE data src tests \
          flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml
        flatpak-builder --user --force-clean --disable-rofiles-fuse \
          --install-deps-from=flathub \
          --repo=build/flatpak-repo \
          build/flatpak flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.yml
        flatpak_files=build/flatpak/files
        if [[ ! -f "$flatpak_files/lib/fcitx5/libfcitx5-google-ime.so" ]]; then
          echo "Error: Flatpak add-on library was not installed under lib/fcitx5"
          exit 1
        fi
        test ! -e "$flatpak_files/lib64/fcitx5/libfcitx5-google-ime.so"
        test -f "$flatpak_files/share/fcitx5/addon/google-ime.conf"
        test -f "$flatpak_files/share/fcitx5/inputmethod/google-ime.conf"
        test -f "$flatpak_files/share/metainfo/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml"

    - name: Upload Flatpak build artifacts
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: build-flatpak-artifacts
        path: build/flatpak-repo/
        if-no-files-found: ignore
        retention-days: 7
