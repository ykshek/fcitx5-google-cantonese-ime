name: Build & Publish Flatpak Add-on

on:
  push:
    branches: [main]
    tags: ['v*']
  # optional: allow manual runs for testing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── CI gate: build on every push to main, but never on tags ──────────────
  ci-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flatpak-setup
      - uses: ./.github/actions/flatpak-build

  # ── Release: build, create GitHub Release, publish to GitHub Pages ──────
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed for creating a release
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flatpak build environment
        uses: ./.github/actions/flatpak-setup

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "GPG_FPR=$FPR" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build Flatpak add‑on (signed)
        uses: ./.github/actions/flatpak-build
        with:
          gpg-sign: ${{ env.GPG_FPR }}
          gpg-home-dir: ${{ env.GNUPGHOME }}
          build-bundle: true
          bundle-output-path: release-artifacts/org.fcitx.Fcitx5.Addon.GoogleIME-${{ steps.vars.outputs.version }}-x86_64.flatpak

      - name: Set version
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(sed -nE 's/^project\(fcitx5-google-cantonese-ime VERSION ([^ )]+).*/\1/p' CMakeLists.txt)
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign the Flatpak repository
        run: |
          flatpak build-update-repo \
            --gpg-sign="$GPG_FPR" \
            --gpg-homedir="$GNUPGHOME" \
            --title="Google Cantonese IME" \
            --comment="fcitx5 add-on: Cantonese input method using Google Input Tools" \
            build/flatpak-repo

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Assemble Pages site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          BASE="${BASE_URL%/}"
          PUB=$(gpg --export --armor "$GPG_FPR" | base64 -w0)
          mkdir -p site
          cp -a build/flatpak-repo site/repo
          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=Google Cantonese IME' \
            "Url=${BASE}/repo" \
            'Comment=fcitx5 add-on: Cantonese input method using Google Input Tools' \
            "GPGKey=${PUB}" > site/index.flatpakrepo
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head><title>Google Cantonese IME — Flatpak repository</title></head>
          <body>
            <h1>Google Cantonese IME</h1>
            <p>A Cantonese input method for fcitx5 that sends romanized input to Google Input Tools over HTTPS. This site hosts the signed Flatpak repository for <strong>fcitx5-google-cantonese-ime</strong>.</p>
            <h2>Add the remote (once)</h2>
            <pre>flatpak remote-add --if-not-exists google-ime ${BASE}/index.flatpakrepo</pre>
            <h2>Install</h2>
            <pre>flatpak install google-ime org.fcitx.Fcitx5.Addon.GoogleIME</pre>
            <p>Single-file bundles for each release are also published on GitHub releases.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Generate checksums
        run: |
          cd release-artifacts
          compgen -G '*.flatpak' >/dev/null
          sha256sum *.flatpak > SHA256SUMS

      - name: Generate release notes
        run: |
          cat > release_notes.md <<EOF
          A self-contained fcitx5 engine that queries Google Input Tools over HTTPS.
          A signed Flatpak repository is published to [GitHub Pages](https://ykshek.github.io/fcitx5-google-cantonese-ime/). Add the remote once and then install or update with plain \`flatpak install\`:

          \`\`\`bash
          # Add the repository (one-time setup)
          flatpak remote-add --if-not-exists google-ime https://ykshek.github.io/fcitx5-google-cantonese-ime/index.flatpakrepo

          # Install
          flatpak install google-ime org.fcitx.Fcitx5.Addon.GoogleIME
          \`\`\`

          The Fcitx5 Flatpak runtime from Flathub must be installed. Restart Fcitx5 and enable the Google IME add-on/input method after installation:
          \`\`\`bash
          flatpak kill org.fcitx.Fcitx5
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: fcitx5-google-cantonese-ime ${{ steps.vars.outputs.version }}
          body_path: release_notes.md
          files: |
            release-artifacts/*.flatpak
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: false

      - name: Update latest tag (optional)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -f latest
          git push origin latest --force
