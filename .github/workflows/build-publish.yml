# Build, publish signed repo to GitHub Pages, and create GitHub Releases.
#
# Consolidates the former build.yml, publish-repo.yml, and release.yml into
# a single workflow with conditionally-triggered jobs.  The daily cron is
# removed — the repo only refreshes on real pushes to main.
name: Build & Publish Flatpak Add-on

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── CI gate (push to main + PRs) ──────────────────────────────────────
  ci-check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flatpak-setup
      - uses: ./.github/actions/flatpak-build

  # ── Publish signed repo to GitHub Pages (tags + dispatch only) ────────
  publish-repo:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flatpak-setup

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "GPG_FPR=$FPR" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - uses: ./.github/actions/flatpak-build
        with:
          gpg-sign: ${{ env.GPG_FPR }}
          gpg-home-dir: ${{ env.GNUPGHOME }}

      - name: Sign the repository
        run: |
          flatpak build-update-repo \
            --gpg-sign="$GPG_FPR" --gpg-homedir="$GNUPGHOME" \
            --title="Google Cantonese IME" \
            --comment="fcitx5 add-on: Cantonese input method using Google Input Tools" \
            build/flatpak-repo

      - id: pages
        uses: actions/configure-pages@v4

      - name: Assemble site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          BASE="${BASE_URL%/}"
          PUB=$(gpg --export --armor "$GPG_FPR" | base64 -w0)
          mkdir -p site
          cp -a build/flatpak-repo site/repo
          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=Google Cantonese IME' \
            "Url=${BASE}/repo" \
            'Comment=fcitx5 add-on: Cantonese input method using Google Input Tools' \
            "GPGKey=${PUB}" > site/index.flatpakrepo
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Google Cantonese IME — Flatpak repository</title>
          </head>
          <body style="font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem;">
            <h1>Google Cantonese IME</h1>
            <p>A Cantonese input method for fcitx5 that sends romanized input to
            Google Input Tools over HTTPS. This site hosts the signed Flatpak
            repository for
            <a href="https://github.com/ykshek/fcitx5-google-cantonese-ime">fcitx5-google-cantonese-ime</a>.</p>

            <h2>Add the remote (once)</h2>
            <pre>flatpak remote-add --if-not-exists google-ime ${BASE}/index.flatpakrepo</pre>

            <h2>Install</h2>
            <p>The Fcitx5 Flatpak (org.fcitx.Fcitx5) must be installed first.</p>
            <pre>flatpak install google-ime org.fcitx.Fcitx5.Addon.GoogleIME</pre>

            <h2>After installing</h2>
            <pre>flatpak kill org.fcitx.Fcitx5</pre>
            <p>Then add "Google IME" in fcitx5's input method list.</p>

            <p>Single-file bundles for each release are also published on
            <a href="https://github.com/ykshek/fcitx5-google-cantonese-ime/releases">GitHub releases</a>.</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

  # ── Build bundle + create GitHub Release (tags + dispatch) ────────────
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up version
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(sed -nE 's/^project\(fcitx5-google-cantonese-ime VERSION ([^ )]+).*/\1/p' CMakeLists.txt)
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/flatpak-setup

      - uses: ./.github/actions/flatpak-build
        with:
          build-bundle: true
          bundle-output-path: release-artifacts/org.fcitx.Fcitx5.Addon.GoogleIME-${{ steps.vars.outputs.version }}-x86_64.flatpak

      - name: Generate checksums
        run: |
          cd release-artifacts
          compgen -G '*.flatpak' >/dev/null
          sha256sum *.flatpak > SHA256SUMS

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          A self-contained fcitx5 engine that queries Google Input Tools over HTTPS.

          ## Installation (Fcitx5 Flatpak)

          ### GitHub Releases bundle

          Download and install the Flatpak add-on bundle for your user:

          \`\`\`bash
          flatpak install --user ./org.fcitx.Fcitx5.Addon.GoogleIME-${{ steps.vars.outputs.version }}-x86_64.flatpak
          \`\`\`

          The Fcitx5 Flatpak runtime from Flathub must be installed. Restart Fcitx5
          and enable the Google IME add-on/input method after installation:

          \`\`\`bash
          flatpak kill org.fcitx.Fcitx5
          \`\`\`

          ### GitHub Pages repository

          A signed Flatpak repository is published to [GitHub Pages](https://ykshek.github.io/fcitx5-google-cantonese-ime/).
          Add the remote once and then install or update with plain `flatpak install`:

          \`\`\`bash
          # Add the repository (one-time setup)
          flatpak remote-add --if-not-exists google-ime \\
            https://ykshek.github.io/fcitx5-google-cantonese-ime/index.flatpakrepo

          # Install
          flatpak install google-ime org.fcitx.Fcitx5.Addon.GoogleIME
          \`\`\`

          ## Verification

          Verify the integrity of downloaded files:

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: fcitx5-google-cantonese-ime ${{ steps.vars.outputs.version }}
          body_path: release_notes.md
          files: |
            release-artifacts/*.flatpak
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: false

      - name: Update latest tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -f latest
          git push origin latest --force