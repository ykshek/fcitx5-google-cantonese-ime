name: "Build Flatpak Add-on"
description: "Build, verify, and optionally bundle the Flatpak add-on"

inputs:
  gpg-sign:
    description: "GPG key fingerprint for signing (optional)"
    required: false
    default: ""
  gpg-home-dir:
    description: "GPG home directory for signing (optional)"
    required: false
    default: ""
  build-bundle:
    description: "Create a .flatpak bundle (for releases)"
    required: false
    default: "false"
  bundle-output-path:
    description: "Output path for the .flatpak bundle (used when build-bundle=true)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Build Flatpak add-on
      env:
        GPG_SIGN: ${{ inputs.gpg-sign }}
        GPG_HOME: ${{ inputs.gpg-home-dir }}
      run: |
        set -euo pipefail
        mkdir -p build

        # Source tarball expected by the manifest.
        # Keep this list in sync with the manifest's sources.
        tar -czf flatpak/source.tar.gz \
          --transform='s,^,source/,' \
          CMakeLists.txt LICENSE data src tests \
          flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml

        extra_args=()
        if [[ -n "$GPG_SIGN" ]]; then
          extra_args+=("--gpg-sign=$GPG_SIGN" "--gpg-homedir=$GPG_HOME")
        fi

        # --user: resolve and install deps in ~/.local/share/flatpak.
        # No sudo — the setup action populated the user installation.
        flatpak-builder \
          --user \
          --force-clean \
          --disable-rofiles-fuse \
          --install-deps-from=flathub \
          "${extra_args[@]}" \
          --repo=build/flatpak-repo \
          build/flatpak \
          flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.yml
      shell: bash

    - name: Verify build output
      run: |
        set -euo pipefail
        f=build/flatpak/files

        expected=(
          "$f/lib/fcitx5/libfcitx5-google-ime.so"
          "$f/share/fcitx5/addon/google-ime.conf"
          "$f/share/fcitx5/inputmethod/google-ime.conf"
          "$f/share/metainfo/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml"
        )
        for path in "${expected[@]}"; do
          if [[ ! -f "$path" ]]; then
            echo "::error::Missing expected file: $path"
            exit 1
          fi
        done

        if [[ -e "$f/lib64/fcitx5/libfcitx5-google-ime.so" ]]; then
          echo "::error::Unexpected lib64 copy of the add-on library"
          exit 1
        fi

        echo "✅ Build output verified"
      shell: bash

    - name: Create release bundle
      if: inputs.build-bundle == 'true' && inputs.bundle-output-path != ''
      run: |
        set -euo pipefail
        out='${{ inputs.bundle-output-path }}'
        mkdir -p "$(dirname "$out")"

        # build-bundle only reads the repo path, so no --user and no sudo.
        flatpak build-bundle \
          --runtime \
          --arch=x86_64 \
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
          build/flatpak-repo \
          "$out" \
          org.fcitx.Fcitx5.Addon.GoogleIME \
          stable
      shell: bash
