# Build the Flatpak add-on, verify outputs, and optionally create a bundle.
#
# Shared by CI (verification), release (bundle creation), and publish-repo
# (signed repo publishing).
name: "Build Flatpak Add-on"
description: "Build and verify the Flatpak add-on"
inputs:
  gpg-sign:
    description: "GPG key fingerprint for signing (optional)"
    required: false
    default: ""
  gpg-home-dir:
    description: "GPG home directory for signing (optional)"
    required: false
    default: ""
  build-bundle:
    description: "Create a .flatpak bundle artifact (for releases)"
    required: false
    default: "false"
  bundle-output-path:
    description: "Output path for the flatpak bundle (used when build-bundle=true)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Build Flatpak add-on
      # The manifest references flatpak/source.tar.gz, whose entries sit
      # under a source/ directory, exactly as `just build-flatpak` does.
      # --gpg-sign signs the exported commit; build-update-repo below only
      # signs the summary. Without a commit signature, clients with
      # gpg-verify enabled refuse the pull.
      run: |
        set -euo pipefail
        mkdir -p build
        tar -czf flatpak/source.tar.gz --transform='s,^,source/,' \
          CMakeLists.txt LICENSE data src tests \
          flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml
        sudo flatpak-builder --force-clean --disable-rofiles-fuse \
          --install-deps-from=flathub \
          ${{ inputs.gpg-sign != '' && format('--gpg-sign={0} --gpg-homedir={1}', inputs.gpg-sign, inputs.gpg-home-dir) || '' }} \
          --repo=build/flatpak-repo \
          build/flatpak flatpak/org.fcitx.Fcitx5.Addon.GoogleIME.yml
      shell: bash

    - name: Verify build output
      run: |
        set -euo pipefail
        flatpak_files=build/flatpak/files
        if [[ ! -f "$flatpak_files/lib/fcitx5/libfcitx5-google-ime.so" ]]; then
          echo "Error: Flatpak add-on library was not installed under lib/fcitx5"
          exit 1
        fi
        test ! -e "$flatpak_files/lib64/fcitx5/libfcitx5-google-ime.so"
        test -f "$flatpak_files/share/fcitx5/addon/google-ime.conf"
        test -f "$flatpak_files/share/fcitx5/inputmethod/google-ime.conf"
        test -f "$flatpak_files/share/metainfo/org.fcitx.Fcitx5.Addon.GoogleIME.metainfo.xml"
      shell: bash

    - name: Create release bundle
      # Only run when build-bundle is true (release workflow).
      if: inputs.build-bundle == 'true' && inputs.bundle-output-path != ''
      run: |
        set -euo pipefail
        mkdir -p "$(dirname '${{ inputs.bundle-output-path }}')"
        sudo flatpak build-bundle --runtime --arch=x86_64 \
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
          build/flatpak-repo \
          "${{ inputs.bundle-output-path }}" \
          org.fcitx.Fcitx5.Addon.GoogleIME stable
      shell: bash