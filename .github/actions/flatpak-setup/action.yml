name: "Setup Flatpak Build Environment"
description: "Prepare a user-level Flathub remote"

runs:
  using: "composite"
  steps:
    - name: Configure user-level Flathub remote
      run: |
        set -euo pipefail

        # Guard: if an image does not ship flatpak-builder, fall back to apt.
        if ! command -v flatpak-builder >/dev/null 2>&1; then
          echo "flatpak-builder not found; installing from apt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
        fi

        flatpak --version
        flatpak-builder --version

        flatpak --user remote-add --if-not-exists \
          flathub https://flathub.org/repo/flathub.flatpakrepo

        flatpak --user install -y --noninteractive flathub \
          org.fcitx.Fcitx5//stable
      shell: bash
